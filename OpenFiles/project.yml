name: OpenFiles
options:
  bundleIdPrefix: dev.robloxdew
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
targets:
  OpenFiles:
    type: application
    platform: iOS
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: OpenFiles
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
    sources:
      - Sources
      - Resources
    entitlements:
      path: OpenFiles.entitlements
      properties:
        com.apple.private.security.no-container: true
        com.apple.private.security.storage.AppBundles: true
        com.apple.private.security.storage.Documents: true
        com.apple.security.files.user-selected.read-write: true
        platform-application: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.robloxdew.openfiles
        CODE_SIGN_ENTITLEMENTS: OpenFiles.entitlements
