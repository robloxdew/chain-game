name: Build iOS IPA from Release

on:
  workflow_dispatch: # 手动触发

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          # ⭐ 这里换成了你刚刚发我的最新链接
          wget -O game_project.zip "https://github.com/robloxdew/chain-game/releases/download/1.10/chain.zip"
          unzip game_project.zip -d game_project
          echo "=== 解压后的目录结构 ==="
          ls -la game_project/
          
      - name: Find Project Root Path
        run: |
          # 自动寻找 project.godot 所在的目录，完美解决套娃文件夹问题
          PROJECT_PATH=$(find game_project -name "project.godot" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_PATH" >> $GITHUB_ENV
          echo "=== 找到项目根目录: $PROJECT_PATH ==="
          echo "=== 检查 export_presets.cfg 关键配置 ==="
          grep -E "name=\"iOS\"|app_store_team_id|bundle_identifier|icon_1024" "$PROJECT_PATH/export_presets.cfg" || true
          echo "=== 检查 icon.png 是否存在 ==="
          ls -la "$PROJECT_PATH/icon.png" || echo "⚠️ 警告: 项目根目录下没有找到 icon.png，请务必添加！"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Download Godot Export Templates (macOS fixed)
        run: |
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L -o templates.tpz $TEMPLATE_URL
          unzip -q templates.tpz -d templates_temp
          mv templates_temp/templates/* "$TEMPLATE_DIR/"
          echo "导出模板安装完成"

      - name: Export Godot to Xcode
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p build
          godot --headless --path . --import --verbose 
          godot --headless --path . --export-release "iOS" build/ios_project.xcodeproj --verbose

      - name: Build IPA (Unsigned)
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          xcodebuild archive \
            -project ios_project.xcodeproj \
            -scheme "ios_project" \
            -archivePath ios_project.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          mkdir -p Payload
          mv ios_project.xcarchive/Products/Applications/*.app Payload/
          zip -r chain_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: chain-unsigned-ipa
          path: ${{ env.PROJECT_DIR }}/build/chain_unsigned.ipa
