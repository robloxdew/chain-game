name: Build iOS IPA from Release

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          wget -O game_project.zip "https://github.com/robloxdew/chain-game/releases/download/1.12/chain.zip"
          unzip game_project.zip -d game_project
          echo "解压完成"
          PROJECT_PATH=$(find game_project -name "project.godot" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_PATH" >> $GITHUB_ENV
          echo "=== 找到项目根目录: $PROJECT_PATH ==="
          rm -rf "$PROJECT_PATH/.godot"

      - name: Force Config and Icon via Python
        run: |
          # ⭐ 核心修复：使用 Python 生成配置文件，避免任何缩进、换行符问题
          python3 -c '
          import os
          project_dir = os.environ["PROJECT_DIR"]
          config_path = os.path.join(project_dir, "export_presets.cfg")
          content = "[runnable_presets]\niOS=\"iOS\"\n\n[preset.0]\nname=\"iOS\"\nplatform=\"iOS\"\ndedicated_server=false\ncustom_features=\"\"\nexport_filter=\"all_resources\"\ninclude_filter=\"\"\nexclude_filter=\"\"\nexport_path=\"\"\npatches=PackedStringArray()\npatch_delta_encoding=false\npatch_delta_compression_level_zstd=19\npatch_delta_min_reduction=0.1\npatch_delta_include_filters=\"*\"\npatch_delta_exclude_filters=\"\"\nencryption_include_filters=\"\"\nencryption_exclude_filters=\"\"\nseed=0\nencrypt_pck=false\nencrypt_directory=false\nscript_export_mode=2\n\n[preset.0.options]\ncustom_template/debug=\"\"\ncustom_template/release=\"\"\narchitectures/arm64=true\napplication/app_store_team_id=\"ABCDE12345\"\napplication/export_method_debug=1\napplication/export_method_release=1\napplication/code_sign_identity_debug=\"\"\napplication/code_sign_identity_release=\"\"\napplication/provisioning_profile_specifier_debug=\"\"\napplication/provisioning_profile_specifier_release=\"\"\napplication/bundle_identifier=\"com.robloxdew.chaingame\"\napplication/signature=\"\"\napplication/short_version=\"1.0\"\napplication/version=\"1.0\"\napplication/additional_plist_content=\"\"\napplication/icon_interpolation=4\napplication/export_project_only=true\napplication/targeted_device_family=0\napplication/min_ios_version=\"14.0\"\nstoryboard/image_scale_mode=0\nstoryboard/use_custom_bg_color=false\nstoryboard/custom_bg_color=Color(0, 0, 0, 1)\nicons/icon_1024x1024=\"res://icon.png\""
          with open(config_path, "w", encoding="utf-8", newline="\n") as f:
              f.write(content)
          print("配置文件已通过 Python 完美生成！")
          '
          
          cd ${{ env.PROJECT_DIR }}
          # ⭐ 彻底删除你的本地 icon.png（它是 WebP 格式，会导致 sips 崩溃），并生成系统标准图标
          rm -f icon.png
          echo "正在生成标准的 1024x1024 PNG 图标..."
          cp /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/GenericApplicationIcon.icns icon.icns
          sips -s format png icon.icns --out icon.png
          sips -z 1024 1024 icon.png --out icon.png
          rm icon.icns
          echo "图标与配置已修复完毕，准备导出！"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Download Godot Export Templates (macOS fixed)
        run: |
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L -o templates.tpz $TEMPLATE_URL
          unzip -q templates.tpz -d templates_temp
          mv templates_temp/templates/* "$TEMPLATE_DIR/"
          echo "导出模板安装完成"

      - name: Export Godot to Xcode
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p build
          godot --headless --path . --import
          godot --headless --path . --export-release "iOS" build/ios_project.xcodeproj

      - name: Build IPA (Unsigned)
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          xcodebuild archive \
            -project ios_project.xcodeproj \
            -scheme "ios_project" \
            -archivePath ios_project.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          mkdir -p Payload
          mv ios_project.xcarchive/Products/Applications/*.app Payload/
          zip -r chain_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: chain-unsigned-ipa
          path: ${{ env.PROJECT_DIR }}/build/chain_unsigned.ipa
