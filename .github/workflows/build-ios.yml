name: Build iOS IPA from Release

on:
  workflow_dispatch: # 手动触发

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          # 已经替换为你提供的永久链接
          wget -O game_project.zip "https://github.com/robloxdew/chain-game/releases/download/7891/chain.zip"
          unzip game_project.zip -d game_project
          echo "=== 解压后的目录结构 ==="
          ls -la game_project/
          echo "=== 检查 project.godot 在哪里 ==="
          find game_project -name "project.godot" -maxdepth 3

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Download Godot Export Templates
        run: |
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable/
          curl -L -o templates.tpz $TEMPLATE_URL
          unzip -q templates.tpz -d templates_temp
          mv templates_temp/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          echo "导出模板安装完成"

      - name: Export Godot to Xcode
        run: |
          # ⚠️ 这里需要根据上一步 find 的结果来确认路径
          # 如果你的 zip 解压出来只有一层 "chain" 文件夹，请把 game_project 改成 game_project/chain
          cd game_project
          mkdir -p build
          godot --headless --path . --import 
          godot --headless --path . --export-release "iOS" build/ios_project.xcodeproj

      - name: Build IPA (Unsigned)
        run: |
          cd game_project/build
          xcodebuild archive \
            -project ios_project.xcodeproj \
            -scheme "ios_project" \
            -archivePath ios_project.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd game_project/build
          mkdir -p Payload
          mv ios_project.xcarchive/Products/Applications/*.app Payload/
          zip -r chain_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: chain-unsigned-ipa
          path: game_project/build/chain_unsigned.ipa
