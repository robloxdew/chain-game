name: Build iOS IPA (Manual from Latest Release)

on:
  workflow_dispatch: # ⭐ 手动触发

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GODOT_VERSION: "4.7.2"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /Applications/Android\ Studio.app
          sudo rm -rf ~/Library/Android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Install GitHub CLI (gh)
        run: |
          # ⭐ 采纳豆包建议，加上 --quiet 并验证
          brew install gh --quiet
          gh --version

      - name: Get Latest Release Tag
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$LATEST_TAG" ]; then
            echo "❌ 没有找到任何发行版！"
            exit 1
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "✅ 自动找到最新发行版: $LATEST_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download chain.zip from Latest Release
        run: |
          gh release download ${{ env.LATEST_TAG }} -p "chain.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip and Locate Project
        run: |
          unzip -q chain.zip -d game/
          PROJECT_PATH=$(find game -name "project.godot" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "❌ 在chain.zip压缩包内找不到 project.godot！"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_PATH" >> $GITHUB_ENV
          echo "=== 找到项目根目录: $PROJECT_PATH ==="

      # ⭐ 核心修复：彻底重写绝对标准的 iOS 配置，并强制清除行首缩进空格
      - name: Force Write Absolute Config
        run: |
          cd ${{ env.PROJECT_DIR }}
          CFG="export_presets.cfg"
          # 尝试提取你原来的包名，提取不到就用默认的
          BUNDLE_ID=$(grep "application/bundle_identifier=" "$CFG" | cut -d'"' -f2 | head -n 1)
          if [ -z "$BUNDLE_ID" ]; then BUNDLE_ID="com.robloxdew.chaingame"; fi
          
          cat > "$CFG" << EOF
          [runnable_presets]
          iOS="iOS"

          [preset.0]
          name="iOS"
          platform="iOS"
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          patch_delta_encoding=false
          patch_delta_compression_level_zstd=19
          patch_delta_min_reduction=0.1
          patch_delta_include_filters="*"
          patch_delta_exclude_filters=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          architectures/arm64=true
          application/app_store_team_id="DEWRB12345"
          application/export_method_debug=1
          application/export_method_release=1
          application/code_sign_identity_debug=""
          application/code_sign_identity_release=""
          application/provisioning_profile_specifier_debug=""
          application/provisioning_profile_specifier_release=""
          application/bundle_identifier="$BUNDLE_ID"
          application/signature=""
          application/short_version="1.0"
          application/version="1.0"
          application/additional_plist_content=""
          application/icon_interpolation=4
          application/export_project_only=true
          application/min_ios_version="14.0"
          icons/icon_1024x1024="res://icon.png"
          EOF
          
          # ⭐ 致命修复：强行删除每一行开头的所有空格，防止 Godot 解析器崩溃
          sed -i '' 's/^[[:space:]]*//' "$CFG"
          
          echo "=== 重写并清除缩进后的配置文件 ==="
          cat "$CFG"

      - name: Ensure Absolute Valid Icon
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ ! -f "icon.png" ]; then
             echo "⚠️ 项目内没有 icon.png，从系统自动生成一张标准图..."
             cp /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/GenericApplicationIcon.icns icon.icns
             sips -s format png icon.icns --out icon.png
             sips -z 1024 1024 icon.png --out icon.png
             rm icon.icns
          fi
          echo "✅ 图标处理完毕"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Install Godot iOS export template (GitHub源，curl下载)
        run: |
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          cd "$TEMPLATE_DIR"
          curl -L -O https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          unzip -q Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mv templates/* .
          rm -rf templates Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          [ -f "iOS.zip" ] && mv iOS.zip ios.zip || true
          echo "✅ 模板安装完成"

      - name: Godot export Xcode project
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p build
          godot --headless --path . --export-release "iOS" build/ios_project.xcodeproj

      - name: Build Xcode project (Unsigned IPA)
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          SCHEME=$(xcodebuild -list -project ios_project.xcodeproj | grep -A1 "Schemes:" | tail -n1 | xargs)
          if [ -z "$SCHEME" ]; then SCHEME="ios_project"; fi
          echo "使用 Scheme: $SCHEME"
          
          xcodebuild archive \
            -project ios_project.xcodeproj \
            -scheme "$SCHEME" \
            -archivePath ios_project.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p Payload
          find ios_project.xcarchive/Products -name "*.app" -exec cp -r {} Payload/ \;
          zip -qr chain_unsigned.ipa Payload
          
          # ⭐ 采纳豆包建议，清理巨大的 xcarchive，避免磁盘爆满导致后续步骤崩溃
          rm -rf ios_project.xcarchive

      - name: Upload IPA to Release
        run: |
          gh release upload ${{ env.LATEST_TAG }} ${{ env.PROJECT_DIR }}/build/chain_unsigned.ipa --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as Actions Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: chain-unsigned-ipa
          path: ${{ env.PROJECT_DIR }}/build/chain_unsigned.ipa
