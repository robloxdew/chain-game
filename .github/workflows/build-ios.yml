name: Build iOS IPA from Release

on:
  workflow_dispatch: # 手动触发

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          wget -O game_project.zip "https://github.com/robloxdew/chain-game/releases/download/7891/chain.zip"
          unzip game_project.zip -d game_project
          echo "=== 解压后的目录结构 ==="
          ls -la game_project/
          echo "=== 检查 project.godot 在哪里 ==="
          find game_project -name "project.godot" -maxdepth 3

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Download Godot Export Templates (macOS fixed)
        run: |
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          # ⭐ 修复：使用 macOS 环境的默认 Godot 模板路径
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L -o templates.tpz $TEMPLATE_URL
          unzip -q templates.tpz -d templates_temp
          # 将解压出来的 templates 文件夹里的内容全部移过去
          mv templates_temp/templates/* "$TEMPLATE_DIR/"
          echo "导出模板安装完成，检查路径内容："
          ls -la "$TEMPLATE_DIR/"

      - name: Export Godot to Xcode
        run: |
          # 如果前面 find 命令显示 project.godot 在子文件夹里
          # 比如 game_project/chain/project.godot，请把下面改成 cd game_project/chain
          cd game_project
          mkdir -p build
          godot --headless --path . --import 
          godot --headless --path . --export-release "iOS" build/ios_project.xcodeproj

      - name: Build IPA (Unsigned)
        run: |
          cd game_project/build
          xcodebuild archive \
            -project ios_project.xcodeproj \
            -scheme "ios_project" \
            -archivePath ios_project.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd game_project/build
          mkdir -p Payload
          mv ios_project.xcarchive/Products/Applications/*.app Payload/
          zip -r chain_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: chain-unsigned-ipa
          path: game_project/build/chain_unsigned.ipa
