name: Build iOS IPA from Release

on:
  workflow_dispatch: # 手动触发

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          wget -O game_project.zip "https://github.com/robloxdew/chain-game/releases/download/1.12/chain.zip"
          unzip game_project.zip -d game_project
          echo "解压完成"

      - name: Find Project and Fix Config
        run: |
          # 自动寻找 project.godot 所在的目录
          PROJECT_PATH=$(find game_project -name "project.godot" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_PATH" >> $GITHUB_ENV
          echo "=== 找到项目根目录: $PROJECT_PATH ==="
          
          # ⭐ 核心修复：直接修改用户自带的 export_presets.cfg，不重写文件！
          CONFIG_FILE="$PROJECT_PATH/export_presets.cfg"
          
          # 1. 修复 Team ID (5位 -> 10位)
          sed -i '' 's/app_store_team_id="dewrb"/app_store_team_id="ABCDE12345"/' "$CONFIG_FILE"
          # 2. 修复包名
          sed -i '' 's/application\/bundle_identifier="com.yourname.chaingame"/application\/bundle_identifier="com.robloxdew.chaingame"/' "$CONFIG_FILE"
          # 3. 禁用 Godot 自带的 Xcode 编译，只导出项目
          sed -i '' 's/application\/export_project_only=false/application\/export_project_only=true/' "$CONFIG_FILE"
          # 4. 强制指定图标路径
          sed -i '' 's/icons\/icon_1024x1024=""/icons\/icon_1024x1024="res:\/\/icon.png"/' "$CONFIG_FILE"
          
          echo "=== 修改后的配置检查 ==="
          grep -E "app_store_team_id|bundle_identifier|export_project_only|icon_1024x1024" "$CONFIG_FILE" || true
          
          # 检查图标，如果缺失，自动找一张替代
          if [ ! -f "$PROJECT_PATH/icon.png" ]; then
            echo "⚠️ 项目内没有 icon.png，尝试自动寻找替代..."
            FOUND_PNG=$(find "$PROJECT_PATH" -name "*.png" -exec ls -S {} + | head -n 1)
            if [ -n "$FOUND_PNG" ]; then
               cp "$FOUND_PNG" "$PROJECT_PATH/icon.png"
               echo "已将 $FOUND_PNG 复制为 icon.png"
            else
               echo "⚠️ 未找到任何 PNG，写入 Base64 占位图"
               echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > "$PROJECT_PATH/icon.png"
            fi
          fi
          echo "配置修复完成！"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Download Godot Export Templates (macOS fixed)
        run: |
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L -o templates.tpz $TEMPLATE_URL
          unzip -q templates.tpz -d templates_temp
          mv templates_temp/templates/* "$TEMPLATE_DIR/"
          echo "导出模板安装完成"

      - name: Export Godot to Xcode
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p build
          godot --headless --path . --import
          godot --headless --path . --export-release "iOS" build/ios_project.xcodeproj

      - name: Build IPA (Unsigned)
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          xcodebuild archive \
            -project ios_project.xcodeproj \
            -scheme "ios_project" \
            -archivePath ios_project.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          mkdir -p Payload
          mv ios_project.xcarchive/Products/Applications/*.app Payload/
          zip -r chain_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: chain-unsigned-ipa
          path: ${{ env.PROJECT_DIR }}/build/chain_unsigned.ipa
