name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          wget -O game_project.zip "https://github.com/robloxdew/chain-game/releases/download/1.13/chain.zip"
          unzip game_project.zip -d game_project
          PROJECT_PATH=$(find game_project -name "project.godot" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_PATH" >> $GITHUB_ENV

      - name: Patch iOS Export Config (use repo full preset)
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 - <<'PYEOF'
          import re
          c = open('export_presets.cfg').read()
          c = re.sub(r'icons/icon_1024x1024="[^"]*"', 'icons/icon_1024x1024="res://icon.png"', c)
          c = re.sub(r'icons/app_store_1024x1024="[^"]*"', 'icons/app_store_1024x1024="res://icon.png"', c)
          c = re.sub(r'application/app_store_team_id="[^"]*"', 'application/app_store_team_id="DEWRB12345"', c)
          open('export_presets.cfg', 'w').write(c)
          print("patched export_presets.cfg")
          # Enable ETC2/ASTC texture compression (required for iOS export validation)
          pg = open('project.godot').read()
          if 'import_etc2_astc' not in pg:
              if '[rendering]' in pg:
                  pg = pg.replace('[rendering]', '[rendering]\n\ntextures/vram_compression/import_etc2_astc=true', 1)
              else:
                  pg += '\n[rendering]\n\ntextures/vram_compression/import_etc2_astc=true\n'
              open('project.godot', 'w').write(pg)
              print("enabled etc2_astc")
          PYEOF

      - name: Generate Absolute Standard Icon
        run: |
          cd ${{ env.PROJECT_DIR }}
          cp /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/GenericApplicationIcon.icns icon.icns
          sips -s format png icon.icns --out icon.png
          sips -z 1024 1024 icon.png --out icon.png
          rm icon.icns

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Download Godot Export Templates
        run: |
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L -o templates.tpz $TEMPLATE_URL
          unzip -q templates.tpz -d templates_temp
          mv templates_temp/templates/* "$TEMPLATE_DIR/"
          # Godot 4.7.2 expects lowercase template names (ios.zip)
          [ -f "$TEMPLATE_DIR/iOS.zip" ] && mv -f "$TEMPLATE_DIR/iOS.zip" "$TEMPLATE_DIR/ios.zip" || true
          ls "$TEMPLATE_DIR/"

      - name: Export Godot to Xcode
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p build
          godot --headless --path . --import
          godot --headless --path . --export-release "iOS" build/ios_project.xcodeproj

      - name: Build IPA (Unsigned)
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          xcodebuild archive \
            -project ios_project.xcodeproj \
            -scheme "ios_project" \
            -archivePath ios_project.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          mkdir -p Payload
          mv ios_project.xcarchive/Products/Applications/*.app Payload/
          zip -r chain_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: chain-unsigned-ipa
          path: ${{ env.PROJECT_DIR }}/build/chain_unsigned.ipa
