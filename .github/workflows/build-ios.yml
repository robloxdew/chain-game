name: Build iOS IPA from Release

on:
  workflow_dispatch: # 手动触发

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          wget -O game_project.zip "https://github.com/robloxdew/chain-game/releases/download/1.10/chain.zip"
          unzip game_project.zip -d game_project
          echo "=== 解压后的目录结构 ==="
          ls -la game_project/

      - name: Find Project Root Path
        id: find_project
        run: |
          # 动态查找 project.godot 所在路径
          PROJECT_PATH=$(find game_project -name "project.godot" -maxdepth 5 | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "❌ 错误：未找到 project.godot 文件！"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          echo "✅ 找到项目根目录: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Download Godot Export Templates (macOS fixed)
        run: |
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L -o templates.tpz $TEMPLATE_URL
          unzip -q templates.tpz -d templates_temp
          mv templates_temp/templates/* "$TEMPLATE_DIR/"
          echo "导出模板安装完成"

      - name: Export Godot to Xcode
        run: |
          # ⭐ 使用刚刚自动找到的路径
          cd ${{ steps.find_project.outputs.project_dir }}
          mkdir -p build
          godot --headless --path . --import 
          godot --headless --path . --export-release "iOS" build/ios_project.xcodeproj

      - name: Build IPA (Unsigned)
        run: |
          cd ${{ steps.find_project.outputs.project_dir }}/build
          xcodebuild archive \
            -project ios_project.xcodeproj \
            -scheme "ios_project" \
            -archivePath ios_project.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd ${{ steps.find_project.outputs.project_dir }}/build
          mkdir -p Payload
          mv ios_project.xcarchive/Products/Applications/*.app Payload/
          zip -r chain_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: chain-unsigned-ipa
          path: ${{ steps.find_project.outputs.project_dir }}/build/chain_unsigned.ipa
