name: Build iOS IPA from Release

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          wget -O game_project.zip "https://github.com/robloxdew/chain-game/releases/download/1.12/chain.zip"
          unzip game_project.zip -d game_project
          echo "解压完成"
          PROJECT_PATH=$(find game_project -name "project.godot" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_PATH" >> $GITHUB_ENV
          echo "=== 找到项目根目录: $PROJECT_PATH ==="
          rm -rf "$PROJECT_PATH/.godot"

      - name: Force Fix Config and Icon (修复缩进)
        run: |
          cat > "${{ env.PROJECT_DIR }}/export_presets.cfg" << 'EOF'
          [runnable_presets]
          iOS="iOS"

          [preset.0]
          name="iOS"
          platform="iOS"
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          patch_delta_encoding=false
          patch_delta_compression_level_zstd=19
          patch_delta_min_reduction=0.1
          patch_delta_include_filters="*"
          patch_delta_exclude_filters=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          architectures/arm64=true
          application/app_store_team_id="ABCDE12345"
          application/export_method_debug=1
          application/export_method_release=1
          application/code_sign_identity_debug=""
          application/code_sign_identity_release=""
          application/provisioning_profile_specifier_debug=""
          application/provisioning_profile_specifier_release=""
          application/bundle_identifier="com.robloxdew.chaingame"
          application/signature=""
          application/short_version="1.0"
          application/version="1.0"
          application/additional_plist_content=""
          application/icon_interpolation=4
          application/export_project_only=true
          application/targeted_device_family=0
          application/min_ios_version="14.0"
          storyboard/image_scale_mode=0
          storyboard/use_custom_bg_color=false
          storyboard/custom_bg_color=Color(0, 0, 0, 1)
          icons/icon_1024x1024="res://icon.png"
          EOF

          # ⭐ 核心修复：清除刚刚写入时产生的所有隐形前导空格！这是导致报错的根本原因。
          sed -i 's/^[[:space:]]*//' "${{ env.PROJECT_DIR }}/export_presets.cfg"

          cd "${{ env.PROJECT_DIR }}"
          # ⭐ 暴力生成标准 1024x1024 图标
          if [ ! -f "icon.png" ]; then
            echo "生成标准图标..."
            cp /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/GenericApplicationIcon.icns icon.icns
            sips -s format png icon.icns --out icon.png
            sips -z 1024 1024 icon.png --out icon.png
            rm icon.icns
          else
            sips -z 1024 1024 icon.png --out icon.png
          fi
          echo "配置文件与图标已在云端完美修复"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Download Godot Export Templates (macOS fixed)
        run: |
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L -o templates.tpz $TEMPLATE_URL
          unzip -q templates.tpz -d templates_temp
          mv templates_temp/templates/* "$TEMPLATE_DIR/"
          echo "导出模板安装完成"

      - name: Export Godot to Xcode
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p build
          godot --headless --path . --import
          godot --headless --path . --export-release "iOS" build/ios_project.xcodeproj

      - name: Build IPA (Unsigned)
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          xcodebuild archive \
            -project ios_project.xcodeproj \
            -scheme "ios_project" \
            -archivePath ios_project.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          mkdir -p Payload
          mv ios_project.xcarchive/Products/Applications/*.app Payload/
          zip -r chain_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: chain-unsigned-ipa
          path: ${{ env.PROJECT_DIR }}/build/chain_unsigned.ipa
