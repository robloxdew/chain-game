name: Build iOS IPA (From Release Source)

# 用途：从最新 Release 拉取 Godot 导出的 iOS 源码压缩包（默认 chain_ios.zip），
# 解压得到 .xcodeproj，archive 成未签名 IPA，回传同一个 Release。
# 放置位置：.github/workflows/build-ios-ipa.yml

on:
  workflow_dispatch:
    inputs:
      asset_name:
        description: "Release 中的 iOS 源码压缩包文件名"
        required: false
        default: "chain_ios.zip"

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # 需要上传 Release 附件

    env:
      ASSET_NAME: ${{ github.event.inputs.asset_name || 'chain_ios.zip' }}
      IPA_NAME: chain_unsigned.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          python3 --version
          sw_vers

      - name: Resolve latest release and download source
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # inputs 为空时回退默认名（workflow_dispatch 的 default 已兜底，这里再保一层）
          ASSET="${ASSET_NAME:-chain_ios.zip}"

          TAG=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases \
                --json tagName --jq '.[0].tagName')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::没有找到任何发行版"
            exit 1
          fi
          echo "最新发行版: $TAG"

          mkdir -p download
          gh release download "$TAG" -p "$ASSET" --dir download
          ls -lh download

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Unpack and locate Xcode project
        id: proj
        run: |
          set -euo pipefail

          ASSET="${{ steps.rel.outputs.asset }}"
          rm -rf src
          mkdir -p src
          unzip -q "download/$ASSET" -d src

          PROJ=$(find src -type d -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "::error::压缩包内没有 .xcodeproj，请确认上传的是 Godot 导出的 iOS 源码"
            echo "=== 压缩包内容（前 60 项）==="
            find src -maxdepth 3 | head -60
            exit 1
          fi

          WORKDIR=$(dirname "$PROJ")
          PROJNAME=$(basename "$PROJ")
          echo "工作目录: $WORKDIR"
          echo "工程文件: $PROJNAME"
          ls -la "$WORKDIR" | head -25

          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"
          echo "projname=$PROJNAME" >> "$GITHUB_OUTPUT"

      - name: Resolve scheme
        id: scheme
        run: |
          set -euo pipefail

          PROJ="${{ steps.proj.outputs.workdir }}/${{ steps.proj.outputs.projname }}"

          echo "=== xcodebuild -list ==="
          xcodebuild -list -project "$PROJ" || true

          # 优先取工程内 shared scheme；解析不到就用工程名兜底
          SCHEME=$(xcodebuild -list -json -project "$PROJ" 2>/dev/null \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); p=d.get("project") or d.get("workspace") or {}; s=p.get("schemes") or []; print(s[0] if s else "")' \
            2>/dev/null || true)

          if [ -z "$SCHEME" ]; then
            SCHEME="${{ steps.proj.outputs.projname }}"
            SCHEME="${SCHEME%.xcodeproj}"
            echo "::warning::未解析到 scheme，回退使用工程名: $SCHEME"
          fi

          echo "使用 Scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Archive (unsigned)
        run: |
          set -euo pipefail

          cd "${{ steps.proj.outputs.workdir }}"
          rm -rf "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild archive \
            -project "${{ steps.proj.outputs.projname }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package unsigned IPA
        id: pack
        run: |
          set -euo pipefail

          APP=$(find "$GITHUB_WORKSPACE/build/app.xcarchive/Products/Applications" \
                -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::archive 产物里没有 .app，检查 xcodebuild.log"
            ls -R "$GITHUB_WORKSPACE/build" | head -40
            exit 1
          fi
          echo "APP: $APP"

          rm -rf "$GITHUB_WORKSPACE/pkg"
          mkdir -p "$GITHUB_WORKSPACE/pkg/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/pkg/Payload/"

          # -y 保留符号链接，Godot 的 framework 里有 symlink，丢了会签名/运行失败
          cd "$GITHUB_WORKSPACE/pkg"
          zip -qry "$GITHUB_WORKSPACE/${IPA_NAME}" Payload

          ls -lh "$GITHUB_WORKSPACE/${IPA_NAME}"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Verify IPA contents
        run: |
          set -euo pipefail

          IPA="$GITHUB_WORKSPACE/${IPA_NAME}"
          echo "=== IPA 结构 ==="
          unzip -l "$IPA" | head -15

          APPDIR=$(find "$GITHUB_WORKSPACE/pkg/Payload" -maxdepth 1 -name "*.app" -type d | head -n 1)
          PLIST="$APPDIR/Info.plist"

          echo "=== Info.plist 关键字段 ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" || true

          echo "=== 可执行文件与 framework ==="
          ls -lh "$APPDIR" | head -20
          ls "$APPDIR/Frameworks" 2>/dev/null || echo "(无 Frameworks 目录)"

      - name: Upload IPA to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.rel.outputs.tag }}" \
            "$GITHUB_WORKSPACE/${IPA_NAME}" --clobber
          echo "已上传到 ${{ steps.rel.outputs.tag }}"

      - name: Upload as Actions artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: chain-unsigned-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "### iOS 构建结果"
            echo ""
            echo "- 发行版: \`${{ steps.rel.outputs.tag }}\`"
            echo "- 来源包: \`${{ steps.rel.outputs.asset }}\`"
            echo "- Scheme: \`${{ steps.scheme.outputs.scheme }}\`"
            if [ -f "${IPA_NAME}" ]; then
              echo "- IPA: \`${IPA_NAME}\` ($(du -h "${IPA_NAME}" | cut -f1))"
              echo "- 签名: 未签名（真机安装需重签）"
            else
              echo "- IPA: 未生成"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
