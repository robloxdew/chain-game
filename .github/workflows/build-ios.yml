name: Build iOS IPA (Self-Signed, from Release)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "iOS Bundle Identifier（自签场景通常保持默认即可）"
        type: string
        default: com.dewrb.game
  push:
    branches: [main, master]

jobs:
  build-ios:
    name: Export, Self-Sign & Package IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 0. 从本仓库 latest release 下载 chain.zip 作为工程源 ----------
      - name: Download chain.zip from Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R "$GITHUB_REPOSITORY" --pattern "chain.zip" --dir "$RUNNER_TEMP" || {
            echo "::error::在 latest release 中未找到 chain.zip 资源。请先在 Releases 页发布一个包含 chain.zip 的版本（Release -- 'Latest release'）";
            exit 1;
          }
          ls -la "$RUNNER_TEMP/chain.zip"

      - name: Extract chain.zip to Workspace Root
        run: |
          rm -rf "$RUNNER_TEMP/chain_src"
          mkdir -p "$RUNNER_TEMP/chain_src"
          unzip -q "$RUNNER_TEMP/chain.zip" -d "$RUNNER_TEMP/chain_src"
          # 兼容 zip 内带顶层目录的结构：定位包含 project.godot 的目录
          PROJ_DIR=$(dirname "$(find "$RUNNER_TEMP/chain_src" -maxdepth 3 -name project.godot | head -1)")
          test -n "$PROJ_DIR" && test -f "$PROJ_DIR/project.godot" || {
            echo "::error::chain.zip 中未找到 project.godot，请确认打包内容为 Godot 工程";
            exit 1;
          }
          echo "工程目录：$PROJ_DIR"
          cp -R "$PROJ_DIR/." "$GITHUB_WORKSPACE/"
          echo "=== 工作区工程文件 ==="
          ls -la "$GITHUB_WORKSPACE/project.godot"
          head -20 "$GITHUB_WORKSPACE/project.godot"

      # ---------- 1. Godot 编辑器（macOS 版，与工程 features=4.7 匹配） ----------
      - name: Download Godot Editor 4.7.2
        run: |
          curl -fsSL -o godot.zip "https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=macos.universal.zip&platform=macos.universal"
          unzip -q godot.zip -d godot
          echo "$PWD/godot/Godot.app/Contents/MacOS" >> "$GITHUB_PATH"

      # ---------- 2. iOS 导出模板（必须与编辑器版本完全一致） ----------
      - name: Install iOS Export Templates
        run: |
          curl -fsSL -o templates.tpz "https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=export_templates.tpz&platform=templates"
          mkdir -p /tmp/templates
          unzip -q templates.tpz -d /tmp/templates
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          cp -R /tmp/templates/templates/. "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"

      # ---------- 3. 同步 Bundle ID 到导出预设 ----------
      - name: Set Bundle Identifier
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          sed -i '' "s|application/bundle_identifier=\"[^\"]*\"|application/bundle_identifier=\"$BUNDLE_ID\"|" export_presets.cfg
          grep bundle_identifier export_presets.cfg

      # ---------- 4. 用 Godot 生成 Xcode 工程（只生成工程，不做签名导出） ----------
      - name: Generate Xcode Project
        run: |
          mkdir -p build
          Godot --headless --import
          Godot --headless --export-release "iOS" "$PWD/build/chain.xcodeproj"
          ls -la build/

      # ---------- 5. 无签名构建 .app（无需任何证书/描述文件/Team ID） ----------
      - name: Build Unsigned .app
        run: |
          cd build
          PROJ=$(ls -d *.xcodeproj | head -1)
          echo "project: $PROJ"
          # 从 xcodebuild -list 解析出 schemes 中的第一个可用名称
          SCHEME=$(xcodebuild -project "$PROJ" -list 2>/dev/null | awk '/Schemes:/{f=1;next} f && NF && !/^$/{print $1; exit}')
          echo "scheme: $SCHEME"
          if [ -z "$SCHEME" ]; then
            SCHEME=$(basename "$PROJ" .xcodeproj)
          fi
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos build -derivedDataPath "$PWD/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          cd ..

      # ---------- 6. ad-hoc 自签 + 打包成 .ipa ----------
      - name: Self-Sign & Package IPA
        run: |
          APP=$(find build/dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          echo "app bundle: $APP"
          test -n "$APP" || { echo "未找到 .app 产物"; exit 1; }
          # ad-hoc 自签：identity 用 "-"，不需要任何 Apple 证书
          codesign --force --sign - "$APP"
          # 按标准 IPA 结构打包：Payload/<AppName>.app
          APP_NAME=$(basename "$APP")
          rm -rf Payload build/chain.ipa
          mkdir -p Payload
          ditto "$APP" "Payload/$APP_NAME"
          ditto -c -k --sequesterRsrc --keepParent Payload build/chain.ipa
          ls -lh build/chain.ipa

      # ---------- 7. 上传构建产物 ----------
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chain-ios-selfsigned
          path: build/chain.ipa
          if-no-files-found: error
