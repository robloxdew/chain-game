name: Build iOS IPA from Release

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          # ⭐ 使用最新 1.12 标签的链接
          wget -O game_project.zip "https://github.com/robloxdew/chain-game/releases/download/1.12/chain.zip"
          unzip game_project.zip -d game_project
          echo "解压完成"

      - name: Patch iOS Config
        run: |
          PROJECT_PATH=$(find game_project -name "project.godot" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_PATH" >> $GITHUB_ENV
          echo "=== 找到项目根目录: $PROJECT_PATH ==="
          
          # ⭐ 清理可能残留的 .godot 缓存
          rm -rf "$PROJECT_PATH/.godot"
          
          cd "$PROJECT_PATH"
          # 备份原始配置
          cp export_presets.cfg export_presets.cfg.bak
          
          echo "=== 原地修补 export_presets.cfg 的关键字段 ==="
          # 修改 Team ID 为 10 位合法格式
          sed -i '' 's/application\/app_store_team_id=.*/application\/app_store_team_id="ABCDE12345"/' export_presets.cfg
          # 修改 Bundle ID 为你自己的标识
          sed -i '' 's/application\/bundle_identifier=.*/application\/bundle_identifier="com.robloxdew.chaingame"/' export_presets.cfg
          # 修改导出模式为仅导出工程文件（不尝试在云端编译）
          sed -i '' 's/application\/export_project_only=.*/application\/export_project_only=true/' export_presets.cfg
          # 强制指定图标路径
          sed -i '' 's/icons\/icon_1024x1024=.*/icons\/icon_1024x1024="res:\/\/icon.png"/' export_presets.cfg
          
          echo "=== 修补后的关键字段 ==="
          grep -E "app_store_team_id|bundle_identifier|export_project_only|icon_1024" export_presets.cfg

      - name: Ensure Icon Exists
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ ! -f "icon.png" ]; then
             echo "⚠️ 没有 icon.png，尝试从项目中找一张图片代替..."
             FOUND_PNG=$(find . -name "*.png" -exec ls -S {} + | head -n 1)
             if [ -n "$FOUND_PNG" ]; then
                sips -z 1024 1024 "$FOUND_PNG" --out "icon.png"
             else
                echo "⚠️ 项目里没有任何图片，生成一张纯白占位图..."
                echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > tmp_icon.png
                sips -z 1024 1024 tmp_icon.png --out icon.png
                rm tmp_icon.png
             fi
          else
             # 如果已经有了，强制调整为 1024x1024 尺寸（iOS 要求）
             sips -z 1024 1024 icon.png --out icon.png
          fi
          echo "图标处理完毕"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Download Godot Export Templates (macOS fixed)
        run: |
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L -o templates.tpz $TEMPLATE_URL
          unzip -q templates.tpz -d templates_temp
          mv templates_temp/templates/* "$TEMPLATE_DIR/"
          echo "导出模板安装完成"

      - name: Export Godot to Xcode
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p build
          godot --headless --path . --import
          godot --headless --path . --export-release "iOS" build/ios_project.xcodeproj

      - name: Build IPA (Unsigned)
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          xcodebuild archive \
            -project ios_project.xcodeproj \
            -scheme "ios_project" \
            -archivePath ios_project.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd ${{ env.PROJECT_DIR }}/build
          mkdir -p Payload
          mv ios_project.xcarchive/Products/Applications/*.app Payload/
          zip -r chain_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: chain-unsigned-ipa
          path: ${{ env.PROJECT_DIR }}/build/chain_unsigned.ipa
