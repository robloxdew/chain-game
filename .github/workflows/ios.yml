name: Build iOS App

on:
  push:
    branches: ["**"]
    paths: ["OpenFiles/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: OpenFiles
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: OpenFiles
        run: |
          set -o pipefail
          xcodebuild -project OpenFiles.xcodeproj \
            -scheme OpenFiles \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Locate app bundle
        run: |
          APP=$(find OpenFiles/build/Build/Products -name "*.app" -maxdepth 4 | head -1)
          echo "APP=$APP" >> $GITHUB_ENV
          echo "found: $APP"

      - name: Re-sign with ldid (keep entitlements)
        run: |
          brew install ldid
          ldid -SOpenFiles/OpenFiles.entitlements "$APP/OpenFiles"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OpenFiles-trollstore.ipa Payload
          echo "打包完成: OpenFiles-trollstore.ipa (TrollStore 可直接安装)"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenFiles-ipa
          path: OpenFiles-trollstore.ipa
